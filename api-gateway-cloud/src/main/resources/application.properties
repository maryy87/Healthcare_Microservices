spring.application.name=api-gateway
server.port=8989

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

##Doctor service Route
spring.cloud.gateway.routes[0].id=doctor
spring.cloud.gateway.routes[0].uri=lb://doctor
spring.cloud.gateway.routes[0].predicates[0]=Path=/doctor/**

spring.cloud.gateway.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[0].filters[0].args.name=doctor
spring.cloud.gateway.routes[0].filters[0].args.fallbackuri=forward:/doctorFallBack

##appuntamento service Route
spring.cloud.gateway.routes[3].id=appuntamento
spring.cloud.gateway.routes[3].uri=lb://appuntamento
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/appuntamento/**

spring.cloud.gateway.routes[3].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[3].filters[0].args.name=appuntamento
spring.cloud.gateway.routes[3].filters[0].args.fallbackuri=forward:/appuntamentoFallBack

##patient service Route
spring.cloud.gateway.routes[1].id=patient
spring.cloud.gateway.routes[1].uri=lb://patient
spring.cloud.gateway.routes[1].predicates[0]=Path=/patient/**

spring.cloud.gateway.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[1].filters[0].args.name=patient
spring.cloud.gateway.routes[1].filters[0].args.fallbackuri=forward:/patientFallBack

##medicalRecord service Route
spring.cloud.gateway.routes[2].id=medicalRecord
spring.cloud.gateway.routes[2].uri=lb://medicalRecord
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/medicalRecord/**

#spring.cloud.gateway.routes[2].filters[0].name=CircuitBreaker
#spring.cloud.gateway.routes[2].filters[0].args.name=medicalRecord
#spring.cloud.gateway.routes[2].filters[0].args.fallbackuri=forward:/medicalRecordFallBack

## Discover Server Route
spring.cloud.gateway.routes[4].id=discovery-server
spring.cloud.gateway.routes[4].uri=http://localhost:8761
spring.cloud.gateway.routes[4].predicates[0]=Path=/eureka/web

logging.level.root = info
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionLocator=INFO
logging.level.org.springframework.cloud.gateway = TRACE

spring.main.web-application-type=reactive